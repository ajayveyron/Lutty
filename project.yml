name: Lutty

options:
  bundleIdPrefix: com.ajaypawriya
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Lutty:
    type: application
    platform: iOS
    sources:
      - path: Lutty
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajaypawriya.Lutty
        PRODUCT_NAME: Lutty
        INFOPLIST_FILE: Lutty/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - LuttyTests
        - LuttyUITests

  LuttyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LuttyTests
    dependencies:
      - target: Lutty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajaypawriya.LuttyTests
        GENERATE_INFOPLIST_FILE: YES

  LuttyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LuttyUITests
    dependencies:
      - target: Lutty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajaypawriya.LuttyUITests
        GENERATE_INFOPLIST_FILE: YES
